<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  
  <script src="getValues.js"></script>
  <title>JS Bin</title>
</head>
<body>
<table id='worksheet_table' class="table table-striped">
    <thead>
    <tr>
        <th>Fuel consumption</th>
        <th>Speed</th>
        <th>Distance</th>
        <th>Fuel</th>
        <th>Available Distance</th>
    </tr>
    </thead>
    <tbody>
    <tr class="package-row">
        <td id="FuelConsumption" name="FuelConsumption">Trip 1</td>
        <td><input type="text" name="SpeedVal" id="SpeedVal" class="form-control" onkeyup="getValues()"/></td>
        <td><input type="text" name="DistanceVal" id="DistanceVal" class="form-control" onkeyup="getValues()"/></td>
        <td><input type="text" name="FuelVal" id="FuelVal" class="form-control" onkeyup="getValues()"/></td>
        <td name="AvailableDistance" id="AvailableDistance"></td>
    </tr>
    <tr class="package-row">
        <td id="FuelConsumption" name="FuelConsumption">Trip 2</td>
        <td><input type="text" name="SpeedVal" id="SpeedVal" class="form-control" onkeyup="getValues()"/></td>
        <td><input type="text" name="DistanceVal" id="DistanceVal" class="form-control" onkeyup="getValues()"/></td>
        <td><input type="text" name="FuelVal" id="FuelVal" class="form-control" onkeyup="getValues()"/></td>
        <td name="AvailableDistance" id="AvailableDistance"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
